networks:
  proxy:
    external: true
  dozzle-socket-proxy:

services:

  dozzle-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-lscr.io/linuxserver/socket-proxy}:${SOCKET_PROXY_IMAGE_TAG:-latest}
    container_name: dozzle-socket-proxy
    hostname: dozzle-socket-proxy
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
    networks:
      - dozzle-socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      ## TODO figure these out
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      CONTAINERS: 0
      DISABLE_IPV6: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      POST: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0

  dozzle:
    image: ${DOZZLE_IMAGE:-amir20/dozzle}:${DOZZLE_IMAGE_TAG:-latest}
    container_name: dozzle
    hostname: dozzle
    restart: unless-stopped
    networks:
      - proxy
      - dozzle-socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      DOCKER_HOST: tcp://dozzle-socket-proxy:2375
      DOZZLE_ENABLE_ACTIONS: true
      DOZZLE_HOSTNAME: dozzle.${DOMAIN_NAME:?}
      DOZZLE_LEVEL: ${DOZZLE_LEVEL:-info}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle-rtr.entryPoints=websecure
      - traefik.http.routers.dozzle-rtr.rule=Host(`dozzle.${DOMAIN_NAME:?}`)
      - traefik.http.services.dozzle-svc.loadBalancer.server.port=8080
