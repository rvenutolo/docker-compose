include:
  - ../defaults.yaml

services:
  dozzle:
    <<: *container-defaults
    image: ${DOZZLE_IMAGE:-amir20/dozzle}:${DOZZLE_IMAGE_TAG:-latest}
    container_name: dozzle
    hostname: dozzle
    volumes:
      - *localtime-bind
      - *docker-socket-bind
    environment:
      DOZZLE_ENABLE_ACTIONS: true
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.entryPoints=websecure
      - traefik.http.routers.dozzle.rule=Host(`dozzle.${DOMAIN_NAME:?}`)
