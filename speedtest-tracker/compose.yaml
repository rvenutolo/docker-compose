services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    hostname: speedtest-tracker
    restart: unless-stopped
    user: ${PUID:?}:${PGID:?}
    ports:
      - "${TAILNET_IP:?}:${SPEEDTEST_TRACKER_PORT:?}:80"
    environment:
      TZ: ${TZ:?}
      APP_KEY: 'base64:2/s3+slHvxao6cdcYbWGhgUInD6h9bJUPlvKM0Ll8jU='
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: '22 * * * *'
      SPEEDTEST_SERVERS: '35058,23094,51330'
      PRUNE_RESULTS_OLDER_THAN: 30
      APP_URL: 'http://speedtest-tracker.${DOMAIN_NAME:?}'
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/speedtest-tracker:/config
      - /etc/localtime:/etc/localtime:ro
