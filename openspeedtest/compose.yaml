networks:
  proxy:
    external: true

services:
  openspeedtest:
    image: ${OPENSPEEDTEST_IMAGE:-openspeedtest/latest}:${OPENSPEEDTEST_IMAGE_TAG:-latest}
    container_name: openspeedtest
    hostname: openspeedtest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      SET_SERVER_NAME: openspeedtest.${DOMAIN_NAME:?}
    labels:
      - traefik.enable=true
      - traefik.http.routers.openspeedtest-rtr.entryPoints=websecure
      - traefik.http.routers.openspeedtest-rtr.middlewares=default-chain-no-auth-mdw@file
      - traefik.http.routers.openspeedtest-rtr.rule=Host(`openspeedtest.${DOMAIN_NAME:?}`)
      - traefik.http.routers.openspeedtest-rtr.tls=true
      - traefik.http.services.openspeedtest-svc.loadBalancer.server.port=3000
