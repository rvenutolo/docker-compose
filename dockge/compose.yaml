## TODO komodo?
networks:
  proxy:
    external: true
  dockge-socket-proxy:
    name: dockge-socket-proxy

services:

  dockge-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-lscr.io/linuxserver/socket-proxy}:${SOCKET_PROXY_IMAGE_TAG:-latest}
    container_name: dockge-socket-proxy
    hostname: dockge-socket-proxy
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
    networks:
      - dockge-socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      ## TODO figure these out
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      CONTAINERS: 0
      DISABLE_IPV6: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      POST: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0

  dockge:
    image: ${DOCKGE_IMAGE:-louislam/dockge}:${DOCKGE_IMAGE_TAG:-latest}
    container_name: dockge
    hostname: dockge
    restart: unless-stopped
    networks:
      - proxy
      - dockge-socket-proxy
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/dockge:/app/data
      - ${DOCKER_COMPOSE_DIR:?}:/opt/stacks
      - /etc/localtime:/etc/localtime:ro
    environment:
      DOCKER_HOST: tcp://dockge-socket-proxy:2375
      DOCKGE_STACKS_DIR: /opt/stacks/ # TODO necessary?
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockge-rtr.entryPoints=websecure
      - traefik.http.routers.dockge-rtr.rule=Host(`dockge.${DOMAIN_NAME:?}`)
      - traefik.http.services.dockge-svc.loadBalancer.server.port=5001
