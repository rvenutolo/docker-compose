services:
  dockge:
    image: ${DOCKGE_IMAGE:-louislam/dockge}:${DOCKGE_IMAGE_TAG:-latest}
    container_name: dockge
    hostname: dockge
    restart: unless-stopped
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/dockge:/app/data
      - ${DOCKER_COMPOSE_DIR:?}:/opt/stacks
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks/ # TODO necessary?
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockge.entryPoints=websecure
      - traefik.http.routers.dockge.rule=Host(`dockge.${DOMAIN_NAME:?}`)
