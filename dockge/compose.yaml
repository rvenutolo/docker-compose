## TODO komodo?
networks:
  proxy:
    external: true

services:
  dockge:
    image: ${DOCKGE_IMAGE:-louislam/dockge}:${DOCKGE_IMAGE_TAG:-latest}
    container_name: dockge
    hostname: dockge
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/dockge:/app/data
      - ${DOCKER_COMPOSE_DIR:?}:/opt/stacks
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks/ # TODO necessary?
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockge-rtr.entryPoints=websecure
      - traefik.http.routers.dockge-rtr.rule=Host(`dockge.${DOMAIN_NAME:?}`)
      - traefik.http.services.dockge-svc.loadBalancer.server.port=5001
