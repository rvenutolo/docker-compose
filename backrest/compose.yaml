## TODO autorestic?
networks:
  proxy:
    external: true

volumes:
  cache:
  config:
  data:
  ssh:

services:
  backrest:
    image: ${BACKREST_IMAGE:-garethgeorge/backrest}:${BACKREST_IMAGE_TAG:-latest}
    container_name: backrest
    hostname: backrest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - ${DOCKER_DIR:?}:/to-backup
      - ${RESTIC_BACKUP_DIR:?}:/repos
      - cache:/cache
      - config:/config
      - data:/data
      - ssh:/root/.ssh
      - /etc/localtime:/etc/localtime:ro
    environment:
      BACKREST_CONFIG: /config/config.json
      BACKREST_DATA: /data
      XDG_CACHE_HOME: /cache
    labels:
      - traefik.enable=true
      - traefik.http.routers.backrest-rtr.entryPoints=websecure
      - traefik.http.routers.backrest-rtr.middlewares=default-chain-no-auth-mdw@file
      - traefik.http.routers.backrest-rtr.rule=Host(`backrest.${DOMAIN_NAME:?}`)
      - traefik.http.routers.backrest-rtr.tls=true
      - traefik.http.services.backrest-svc.loadBalancer.server.port=9898
