include:
  - ../defaults.yaml

services:
  changedetection:
    <<: *container-defaults
    image: ${CHANGEDETECTION_IMAGE:-dgtlmoon/changedetection.io}:${CHANGEDETECTION_IMAGE_TAG:-latest}
    container_name: changedetection
    hostname: changedetection
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/changedetection:/datastore
      - *localtime-bind
    labels:
      - traefik.enable=true
      - traefik.http.routers.changedetection.entryPoints=websecure
      - traefik.http.routers.changedetection.rule=Host(`changedetection.${DOMAIN_NAME:?}`)
