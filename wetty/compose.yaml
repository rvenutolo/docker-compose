networks:
  proxy:
    external: true

services:
  wetty:
    image: ${WETTY_IMAGE:-wettyoss/wetty}:${WETTY_IMAGE_TAG:-latest}
    container_name: wetty
    hostname: wetty
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ~/.keys/id_ed25519:/id_ed25519:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      BASE: /
      SSHHOST: ${DOMAIN_NAME:?}
      SSHUSER: ${USER:?}
      SSHAUTH: publickey
      SSHKEY: /id_ed25519
      TITLE: WeTTY - ${DOMAIN_NAME:?}
    labels:
      - traefik.docker.network=proxy
      - traefik.enable=true
      - traefik.http.routers.wetty-rtr.entryPoints=websecure
      - traefik.http.routers.wetty-rtr.middlewares=default-chain-mdw
      - traefik.http.routers.wetty-rtr.rule=Host(`wetty.${DOMAIN_NAME:?}`)
      - traefik.http.services.wetty-svc.loadBalancer.server.port=3000
