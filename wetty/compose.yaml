include:
  - ../traefik-proxy-network.yaml

services:
  wetty:
    extends:
      file: ../service-defaults.yaml
      service: service-defaults
    image: ${WETTY_IMAGE:-wettyoss/wetty}:${WETTY_IMAGE_TAG:-latest}
    container_name: wetty
    hostname: wetty
    volumes:
      - ~/.keys/id_ed25519:/id_ed25519:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      BASE: /
      SSHHOST: ${DOMAIN_NAME:?}
      SSHUSER: ${USER:?}
      SSHAUTH: publickey
      SSHKEY: /id_ed25519
      TITLE: WeTTY - ${DOMAIN_NAME:?}
    labels:
      - traefik.enable=true
      - traefik.http.routers.wetty-rtr.entryPoints=websecure
      - traefik.http.routers.wetty-rtr.rule=Host(`wetty.${DOMAIN_NAME:?}`)
      - traefik.http.services.wetty-svc.loadBalancer.server.port=3000
