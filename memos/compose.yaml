networks:
  proxy:
    external: true

services:
  memos:
    image: ${MEMOS_IMAGE:-neosmemo/memos}:${MEMOS_IMAGE_TAG:-latest}
    container_name: memos
    hostname: memos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/memos/var/opt/memos:/var/opt/memos
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.http.routers.memos-rtr.rule=Host(`memos.${DOMAIN_NAME:?}`)
      - traefik.http.services.memos-svc.loadBalancer.server.port=5230
