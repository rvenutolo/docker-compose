http:
  routers:
    webmin-rtr:
      entryPoints:
        - websecure
      middlewares:
        - default-chain-with-auth-mdw@file
      rule: Host(`webmin.{{ env "DOMAIN_NAME" }}`)
      service: webmin-svc
      tls: true
  services:
    webmin-svc:
      loadBalancer:
        servers:
          - url: https://{{ env "DOMAIN_NAME" }}:10000
        serversTransport: webmin-stx
  serversTransports:
    webmin-stx:
      insecureSkipVerify: true
