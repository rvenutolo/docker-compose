networks:
  proxy:
    external: true
  glances-socket-proxy:
    name: glances-socket-proxy

services:

  glances-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-lscr.io/linuxserver/socket-proxy}:${SOCKET_PROXY_IMAGE_TAG:-latest}
    container_name: glances-socket-proxy
    hostname: glances-socket-proxy
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
    networks:
      - glances-socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      ## TODO figure these out
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      CONTAINERS: 0
      DISABLE_IPV6: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      POST: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0

  glances:
    image: ${GLANCES_IMAGE:-nicolargo/glances}:${GLANCES_IMAGE_TAG:-latest-full}
    container_name: glances
    hostname: glances
    restart: unless-stopped
    networks:
      - proxy
      - glances-socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      GLANCES_OPT: --webserver
    labels:
      - traefik.docker.network=proxy
      - traefik.enable=true
      - traefik.http.routers.glances-rtr.entryPoints=websecure
      - traefik.http.routers.glances-rtr.rule=Host(`glances.${DOMAIN_NAME:?}`)
      - traefik.http.services.glances-svc.loadBalancer.server.port=61208
