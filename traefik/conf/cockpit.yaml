http:
  routers:
    cockpit:
      entryPoints:
        - websecure
      rule: 'Host(`cockpit.{{ env "DOMAIN_NAME" }}`)'
      service: cockpit
  services:
    cockpit:
      loadBalancer:
        servers:
          - url: 'https://{{ env "DOMAIN_NAME" }}:9090'
        serversTransport: cockpit
  serversTransports:
    cockpit:
      insecureSkipVerify: true
