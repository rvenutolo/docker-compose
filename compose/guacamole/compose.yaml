networks:
  proxy:
    external: true
  default:

services:

  guacamole-postgres:
    image: postgres:17
    container_name: guacamole-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/guacamole/postgres/docker-entrypoint-initdb.d/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ${DOCKER_APP_DATA_DIR:?}/guacamole/postgres/data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      PGDATA: /data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: guacamole_user
      POSTGRES_DB: guacamole_db
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    volumes:
      - /etc/localtime:/etc/localtime:ro

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - default
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guacamole-postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?}
    depends_on:
      - guacamole-postgres
      - guacd
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.guacamole-add-prefix-mdw.addPrefix.prefix=/guacamole
      - traefik.http.routers.guacamole-rtr.middlewares=guacamole-add-prefix-mdw@docker
      - traefik.http.routers.guacamole-rtr.rule=Host(`guacamole.${DOMAIN_NAME:?}`)
      - traefik.http.services.guacamole-svc.loadBalancer.server.port=8080
