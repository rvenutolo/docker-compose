networks:
  proxy:
    external: true
  socket-proxy:

services:

  glances-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: glances-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
    networks:
      - socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      IMAGES: 1
    healthcheck:
      test: wget --spider --quiet http://localhost:2375/version || exit 1

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - socket-proxy
    depends_on:
      glances-socket-proxy:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      DOCKER_HOST: tcp://glances-socket-proxy:2375
      GLANCES_OPT: --webserver
    healthcheck:
      test: curl -sSfi http://localhost:61208/api/4/status | head -n 1 | grep -Fw '200 OK' || exit 1
    labels:
      - traefik.enable=true
      - traefik.http.routers.glances-rtr.rule=Host(`glances.${DOMAIN_NAME:?}`)
      - traefik.http.services.glances-svc.loadBalancer.server.port=61208
