cluster:
  routing:
    allocation:
      disk:
        threshold_enabled: false
compatibility:
  override_main_response_version: true
discovery:
  type: single-node
http:
  port: 9200-9299
network:
  host: 0.0.0.0
node:
  name: wazuh.indexer
path:
  data: /var/lib/wazuh-indexer
  logs: /var/log/wazuh-indexer
plugins:
  security:
    allow_default_init_securityindex: true
    authcz:
      admin_dn:
        - "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
    check_snapshot_restore_write_privileges: true
    enable_snapshot_restore_privilege: true
    nodes_dn:
      - "CN=wazuh-indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
    restapi:
      roles_enabled:
        - all_access
        - security_rest_api_access
    ssl:
      http:
        enabled: true
        pemcert_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer.pem
        pemkey_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer.key
        pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
      transport:
        enforce_hostname_verification: false
        pemcert_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer.pem
        pemkey_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer.key
        pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
        resolve_hostname: false
    system_indices:
      enabled: true
      indices: [".opendistro-alerting-config", ".opendistro-alerting-alert*", ".opendistro-anomaly-results*", ".opendistro-anomaly-detector*", ".opendistro-anomaly-checkpoints", ".opendistro-anomaly-detection-state", ".opendistro-reports-*", ".opendistro-notifications-*", ".opendistro-notebooks", ".opensearch-observability", ".opendistro-asynchronous-search-response*", ".replication-metadata-store"]
transport:
  tcp:
    port: 9300-9399
