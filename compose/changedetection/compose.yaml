networks:
  proxy:
    external: true

services:
  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/changedetection/datastore:/datastore
      - /etc/localtime:/etc/localtime:ro
    labels:
      - deunhealth.restart.on.unhealthy=true
      - traefik.enable=true
      - traefik.http.routers.changedetection-rtr.rule=Host(`changedetection.${DOMAIN_NAME:?}`)
      - traefik.http.services.changedetection-svc.loadBalancer.server.port=5000
