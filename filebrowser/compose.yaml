include:
  - ../defaults.yaml

services:
  filebrowser:
    <<: *container-defaults
    image: ${FILEBROWSER_IMAGE:-filebrowser/filebrowser}:${FILEBROWSER_IMAGE_TAG:-latest}
    container_name: filebrowser
    hostname: filebrowser
    volumes:
      - ~:/srv
      - ${DOCKER_APP_DATA_DIR:?}/filebrowser/filebrowser.db:/database.db
      - ${DOCKER_APP_DATA_DIR:?}/filebrowser/filebrowser.json:/.filebrowser.json
      - *localtime-bind
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.entryPoints=websecure
      - traefik.http.routers.filebrowser.rule=Host(`filebrowser.${DOMAIN_NAME:?}`)
