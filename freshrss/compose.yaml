networks:
  proxy:
    external: true

services:
  freshrss:
    image: ${FRESHRSS_IMAGE:-freshrss/freshrss}:${FRESHRSS_IMAGE_TAG:-latest}
    container_name: freshrss
    hostname: freshrss
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/freshrss/var/www/FreshRSS/data:/var/www/FreshRSS/data
      - ${DOCKER_APP_DATA_DIR:?}/freshrss/var/www/FreshRSS/extensions:/var/www/FreshRSS/extensions
      - ./config.custom.php:/var/www/FreshRSS/data/config.custom.php:ro
      - ./config-user.custom.php:/var/www/FreshRSS/data/config-user.custom.php:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      CRON_MIN: 13,43
#      TRUSTED_PROXY: 172.16.0.1/12 192.168.0.1/16
      FRESHRSS_INSTALL: >-
        --base-url https://freshrss.${DOMAIN_NAME:?}
        --default-user ${USER:?}
        --language en
        --auth-type none
      FRESHRSS_USER: >-
        --language en
        --user ${USER:?}
    labels:
      - traefik.enable=true
      - traefik.http.routers.freshrss-rtr.rule=Host(`freshrss.${DOMAIN_NAME:?}`)
      - traefik.http.services.freshrss-svc.loadBalancer.server.port=80
