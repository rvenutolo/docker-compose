include:
  - ../traefik-proxy-network.yaml

services:
  hello-world:
    extends:
      file: ../service-defaults.yaml
      service: service-defaults
    image: crccheck/hello-world:latest
    container_name: hello-world
    hostname: hello-world
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.hello-world-rtr.entryPoints=websecure
      - traefik.http.routers.hello-world-rtr.rule=Host(`hello-world.${DOMAIN_NAME:?}`)
      - traefik.http.services.hello-world-svc.loadBalancer.server.port=8000
