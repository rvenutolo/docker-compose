networks:
  watchtower-socket-proxy:
    name: watchtower-socket-proxy

services:
  
  watchtower-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-lscr.io/linuxserver/socket-proxy}:${SOCKET_PROXY_IMAGE_TAG:-latest}
    container_name: watchtower-socket-proxy
    hostname: watchtower-socket-proxy
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
    networks:
      - watchtower-socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      ## TODO figure these out
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      CONTAINERS: 1
      DISABLE_IPV6: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 1
      INFO: 0
      NETWORKS: 1
      NODES: 0
      POST: 1
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 1
  
  watchtower:
    image: ${WATCHTOWER_IMAGE:-containrrr/watchtower}:${WATCHTOWER_IMAGE_TAG:-latest}
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped
    networks:
      - watchtower-socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      DOCKER_HOST: tcp://watchtower-socket-proxy:2375
      TZ: ${DOCKER_TZ:?}
      WATCHTOWER_CLEANUP: ${WATCHTOWER_CLEANUP:-true}
      WATCHTOWER_DISABLE_CONTAINERS: ${WATCHTOWER_DISABLE_CONTAINERS:-}
      WATCHTOWER_INCLUDE_RESTARTING: ${WATCHTOWER_INCLUDE_RESTARTING:-true}
      WATCHTOWER_INCLUDE_STOPPED: ${WATCHTOWER_INCLUDE_STOPPED:-true}
      WATCHTOWER_NOTIFICATION_URL: discord://${DISCORD_TOKEN:?}@${DISCORD_WEBHOOK_ID:?}
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
      WATCHTOWER_REVIVE_STOPPED: ${WATCHTOWER_REVIVE_STOPPED:-false}
      WATCHTOWER_ROLLING_RESTART: ${WATCHTOWER_ROLLING_RESTART:-false}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 3 * * *}
      WATCHTOWER_TIMEOUT: ${WATCHTOWER_TIMEOUT:-30s}
