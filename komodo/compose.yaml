    image: ${KOMODO_PERIPHERY_IMAGE:-ghcr.io/mbecker20/periphery}:${KOMODO_PERIPHERY_IMAGE_TAG:-latest}
    container_name: komodo-periphery
    hostname: komodo-periphery
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
#      - socket-proxy
#    depends_on:
