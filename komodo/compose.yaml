networks:
  proxy:
    external: true
#  socket-proxy:
  default:

services:

  ## TODO check written files ownership
  komodo-mongo:
    image: ${MONGO_IMAGE:-mongo}:${MONGO_IMAGE_TAG:-8}
    container_name: komodo-mongo
    hostname: komodo-mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/komodo/mongo/data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    command: --quiet --wiredTigerCacheSizeGB 0.25
    labels:
      - komodo.skip

  komodo:
    image: ${KOMODO_IMAGE:-ghcr.io/mbecker20/komodo}:${KOMODO_IMAGE_TAG:-latest}
    container_name: komodo
    hostname: komodo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - default
    depends_on:
      - komodo-mongo
    volumes:
      - ${DOCKER_APP_DATA_DIR:?}/komodo/komodo/action-cache:/action-cache
      - ${DOCKER_APP_DATA_DIR:?}/komodo/komodo/repo-cache:/repo-cache
      - ${DOCKER_APP_DATA_DIR:?}/komodo/komodo/syncs:/syncs
      - /etc/localtime:/etc/localtime:ro
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD: ${MONGO_PASSWORD:?}
      KOMODO_DISABLE_CONFIRM_DIALOG: ${KOMODO_DISABLE_CONFIRM_DIALOG:-false}
      KOMODO_DISABLE_NON_ADMIN_CREATE: ${KOMODO_DISABLE_NON_ADMIN_CREATE:-false}
      KOMODO_DISABLE_USER_REGISTRATION: ${KOMODO_DISABLE_USER_REGISTRATION:-false}
      KOMODO_ENABLE_NEW_USERS: ${KOMODO_ENABLE_NEW_USERS:-false}
      KOMODO_FIRST_SERVER:
      KOMODO_HOST: https://komodo.${DOMAIN_NAME:?}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET:?}
      KOMODO_KEEP_ALERTS_FOR_DAYS: ${KOMODO_KEEP_ALERTS_FOR_DAYS:-28}
      KOMODO_KEEP_STATS_FOR_DAYS: ${KOMODO_KEEP_STATS_FOR_DAYS:-28}
      KOMODO_LOCAL_AUTH: ${KOMODO_LOCAL_AUTH:-false}
      KOMODO_LOGGING_LEVEL: ${KOMODO_LOGGING_LEVEL:-info}
      KOMODO_MONITORING_INTERVAL: ${KOMODO_MONITORING_INTERVAL:-15-sec}
      KOMODO_PASSKEY: ${KOMODO_PASSKEY:?}
      KOMODO_RESOURCE_POLL_INTERVAL: ${KOMODO_RESOURCE_POLL_INTERVAL:-5-min}
      KOMODO_TITLE: Komodo - komodo.${DOMAIN_NAME:?}
      KOMODO_TRANSPARENT_MODE: ${KOMODO_TRANSPARENT_MODE:-false}
      KOMODO_UI_WRITE_DISABLED: ${KOMODO_UI_WRITE_DISABLED:-false}
    labels:
      - komodo.skip
      - traefik.enable=true
      - traefik.http.routers.komodo-rtr.rule=Host(`komodo.${DOMAIN_NAME:?}`)
      - traefik.http.services.komodo-svc.loadBalancer.server.port=9120

