networks:
  proxy:
    external: true
  socket-proxy:
  default:

volumes:
  action-cache:
  mongo-config:
  mongo-data:
  repo-cache:
  syncs:

services:

  ## TODO check written files ownership
  komodo-mongo:
    image: ${MONGO_IMAGE:-mongo}:${MONGO_IMAGE_TAG:-8}
    container_name: komodo-mongo
    hostname: komodo-mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    volumes:
      - mongo-config:/data/configdb
      - mongo-data:/data/db
      - /etc/localtime:/etc/localtime:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    command: --quiet --wiredTigerCacheSizeGB 0.25
    labels:
      - komodo.skip

  komodo:
    image: ${KOMODO_IMAGE:-ghcr.io/mbecker20/komodo}:${KOMODO_IMAGE_TAG:-latest}
    container_name: komodo
    hostname: komodo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - default
    depends_on:
      - komodo-mongo
    volumes:
      - action-cache:/action-cache
      - repo-cache:/repo-cache
      - syncs:/syncs
      - /etc/localtime:/etc/localtime:ro
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD: ${MONGO_PASSWORD:?}
      # https://github.com/mbecker20/komodo/blob/main/config/core.config.toml
      KOMODO_HOST: https://komodo.${DOMAIN_NAME:?}
      KOMODO_TITLE: Komodo - komodo.${DOMAIN_NAME:?}
      KOMODO_PASSKEY: ${KOMODO_PASSKEY:?}
#      KOMODO_FIRST_SERVER: https://komodo-periphery:8120
      KOMODO_UI_WRITE_DISABLED: ${KOMODO_UI_WRITE_DISABLED:-false}
      KOMODO_DISABLE_CONFIRM_DIALOG: ${KOMODO_DISABLE_CONFIRM_DIALOG:-false}
      KOMODO_LOCAL_AUTH: ${KOMODO_LOCAL_AUTH:-false}
      KOMODO_DISABLE_USER_REGISTRATION: ${KOMODO_DISABLE_USER_REGISTRATION:-false}
      KOMODO_ENABLE_NEW_USERS: ${KOMODO_ENABLE_NEW_USERS:-false}
      KOMODO_TRANSPARENT_MODE: ${KOMODO_TRANSPARENT_MODE:-false}
      KOMODO_DISABLE_NON_ADMIN_CREATE: ${KOMODO_DISABLE_NON_ADMIN_CREATE:-false}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET:?}
      KOMODO_LOGGING_LEVEL: ${KOMODO_LOGGING_LEVEL:-info}
      KOMODO_KEEP_STATS_FOR_DAYS: ${KOMODO_KEEP_STATS_FOR_DAYS:-28}
      KOMODO_KEEP_ALERTS_FOR_DAYS: ${KOMODO_KEEP_ALERTS_FOR_DAYS:-28}
      KOMODO_MONITORING_INTERVAL: ${KOMODO_MONITORING_INTERVAL:-15-sec}
      KOMODO_RESOURCE_POLL_INTERVAL: ${KOMODO_RESOURCE_POLL_INTERVAL:-5-min}
    labels:
      - komodo.skip
      - traefik.enable=true
      - traefik.http.routers.komodo-rtr.middlewares=default-chain-with-auth-mdw@file
      - traefik.http.routers.komodo-rtr.rule=Host(`komodo.${DOMAIN_NAME:?}`)
      - traefik.http.routers.komodo-rtr.tls=true
      - traefik.http.services.komodo-svc.loadBalancer.server.port=9120

  komodo-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-lscr.io/linuxserver/socket-proxy}:${SOCKET_PROXY_IMAGE_TAG:-latest}
    container_name: komodo-socket-proxy
    hostname: komodo-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
    networks:
      - socket-proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      INFO: 1
      POST: 1
      SERVICES: 1
    labels:
      - komodo.skip

  komodo-periphery:
    image: ${KOMODO_PERIPHERY_IMAGE:-ghcr.io/mbecker20/periphery}:${KOMODO_PERIPHERY_IMAGE_TAG:-latest}
    container_name: komodo-periphery
    hostname: komodo-periphery
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - socket-proxy
    depends_on:
      - komodo-socket-proxy
    volumes:
      ## Mount external docker socket
      - ${DOCKER_SOCKET:?}:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## use self signed certs in docker volume,
      ## or mount your own signed certs.
      #- ssl-certs:/etc/komodo/ssl
      ## manage repos in a docker volume,
      ## or change it to an accessible host directory.
      #- repos:/etc/komodo/repos
      ## manage stack files in a docker volume,
      ## or change it to an accessible host directory.
      - ${DOCKER_COMPOSE_DIR:?}:/etc/komodo/stacks
      ## Optionally mount a path to store compose files
      # - /path/to/compose:/host/compose
      - /etc/localtime:/etc/localtime:ro
#    environment:
#      DOCKER_HOST: tcp://komodo-socket-proxy:2375
    labels:
      - komodo.skip
